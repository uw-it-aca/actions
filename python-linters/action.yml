name: 'Linters for Python apps'

description: 'Runs checks for python apps'

inputs:
  app_name:
    required: true
  linter:
    description: 'Linter to run: ruff, pycodestyle, or all'
    required: false
    default: 'ruff'
  exclude_paths:
    description: 'Paths excluded from style checks'
    required: false
    default: ''
  license:
    description: 'License to check'
    required: false
    default: 'Apache-2.0'
  copyright_owner:
    description: 'Copyright owner to check'
    required: false
    default: 'UW-?IT, University of Washington'

runs:
  using: 'composite'

  steps:
    - name: Run Python Linters
      shell: bash
      run: |
        if [[ ! -f "./Dockerfile" ]]; then
          linter="${{ inputs.linter }}"
          linter="${linter,,}"

          ruff_args=(check "${{ inputs.app_name }}/")
          pycodestyle_args=("${{ inputs.app_name }}/")
          if [[ -n "${{ inputs.exclude_paths }}" ]]; then
            ruff_args+=(--exclude "${{ inputs.exclude_paths }}")
            pycodestyle_args+=(--exclude="${{ inputs.exclude_paths }}")
          fi

          case "$linter" in
            ruff)
              pip install ruff
              ruff "${ruff_args[@]}"
              ;;
            pycodestyle)
              pip install pycodestyle
              pycodestyle "${pycodestyle_args[@]}"
              ;;
            all)
              pip install ruff pycodestyle
              ruff "${ruff_args[@]}"
              pycodestyle "${pycodestyle_args[@]}"
              ;;
            *)
              echo "Invalid linter '${{ inputs.linter }}'. Valid options are: ruff, pycodestyle, all"
              exit 1
              ;;
          esac
        fi

    - name: Check for License Headers
      shell: bash
      run: |
        if [[ -f "./LICENSE" ]]; then
          LICENSE_ERR=$(find ${{ inputs.app_name }} -type f -size +0 -not -path "*/migrations/*" -name "*.py"\
            -exec grep -PzL "# Copyright $(date +'%Y') ${{ inputs.copyright_owner }}\n# SPDX-License-Identifier: ${{ inputs.license }}" {} \;)
          if [[ ! -z $LICENSE_ERR ]]; then
            echo "Missing License or Copyright information:"
            echo "$LICENSE_ERR"
            exit 1
          fi
        fi
