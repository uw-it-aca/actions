#
# Example GitHub Actions config that drives UW-IT AXD2 integration and deployment
#
# Preconditions:
#
#  1) Application docker build is based on django-container
#
#  2) Application test suite is kicked off in docker/test.sh
#
#  3) Application repo has access to the two secrets
#     at https://github.com/organizations/uw-it-aca/settings/secrets:
#
#     GH_AUTH_TOKEN: Grants access to private flux deployment repo
#     GCP_JSON_KEY: Grants access to Google Cloud Registry
#
# To adapt this config file to a specific django project:
#
#  1) Set RELEASE_NAME suitable for deployment to k8s. RELEASE_NAME must
#     match the "repo" value in docker/*-values.yml.
#
#  2) Set DJANGO_APP to the name of the django project name/directory.
#
#  3) Verify that the lists of branches for push/pull_request is appropriate,
#     and add other branch names if needed.  Additional branch names must
#     also have steps defined in the deploy job
#
#  4) Confirm that the build steps are suitable.  Likely they are, but
#     some projects have an intermediate build step that could benefit
#     from caching, so it may be useful to augment the build steps.
#
---
name: Build, Test and Deploy

env:
  # Release name must match "repo" value in docker/*-values.yml
  RELEASE_NAME: appname
  DJANGO_APP: django_project

# Be sure that branches defined here have corresponding steps
# defined in the "deploy" job
on:
  push:
    branches: [main, master, qa, develop, feature/eval-me]
  pull_request:
    branches: [main, master, qa, develop, feature/eval-me]
    types: [opened, reopened, synchronize]

jobs:
  context:
    runs-on: ubuntu-24.04

    outputs:
      commit_hash: ${{ steps.context.outputs.commit_hash }}
      git_repo_branch: ${{ steps.context.outputs.git_repo_branch }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      content_tag: ${{ steps.context.outputs.content_tag }}
      content_image_tag: ${{ steps.context.outputs.content_image_tag }}

    steps:
      - name: Set up Context
        id: context
        uses: uw-it-aca/actions/cicd-context@main
        with:
          release_name: ${{ env.RELEASE_NAME }}

  # Merge promotes an already-tested candidate image instead of rebuilding
  # it; see docs/proposals/build-once-promote-on-merge.md. Only meaningful
  # on push - on pull_request this job doesn't run, so
  # needs.promote.outputs.promoted is empty and the build job below runs
  # exactly as it did before this was added.
  promote:
    runs-on: ubuntu-24.04

    if: github.event_name == 'push'

    needs: context

    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}

    steps:
      - name: Promote candidate image if one exists
        id: promote
        uses: uw-it-aca/actions/gcr-promote@main
        with:
          image_tag: ${{ needs.context.outputs.image_tag }}
          content_image_tag: ${{ needs.context.outputs.content_image_tag }}
          gcp_json_key: ${{ secrets.GCP_JSON_KEY }}

  build:
    runs-on: ubuntu-24.04

    # Runs whenever promote didn't already ship this exact content -
    # skipped entirely on a successful promotion. !failure() && !cancelled()
    # (rather than the implicit default) is needed because promote is
    # itself skipped on pull_request events, and a skipped dependency
    # would otherwise skip this job too.
    if: ${{ !failure() && !cancelled() && needs.promote.outputs.promoted != 'true' }}

    needs: [context, promote]

    permissions:
      contents: read
      security-events: write
      # Coveralls may or may not need the following permissions
      # pull-requests: write    # For PR comments
      # statuses: write        # For commit status updates
      # checks: write          # For check runs

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Python Linters
        uses: uw-it-aca/actions/python-linters@main
        with:
          app_name: ${DJANGO_APP}
          exclude_paths: 'migrations'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-$(echo ${{ hashFiles('Dockerfile') }} | head -c 16)
          restore-keys: |
            ${{ runner.os }}-buildx-

        # Build App Image (tagged both by commit and by content, so
        # either a PR candidate push or a merge fallback push can use
        # the same local image without rebuilding)
      - name: Build App Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app-container
          tags: |
            ${{ needs.context.outputs.image_tag }}
            ${{ needs.context.outputs.content_image_tag }}
          push: false
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      # Build Test Image
      - name: Build Test Image
        uses: docker/build-push-action@v7
        with:
          target: app-test-container
          tags: app-test-container
          push: false
          load: true

      # Run Python Tests
      - name: Run Tests in Image
        id: tests
        shell: bash
        run: >-
          docker run --rm -u root -t
          -v "${PWD}:/coverage"
          -e DJANGO_APP="$DJANGO_APP"
          -e "ENV=localdev" -e "AUTH=SAML_MOCK"
          app-test-container
          bash -c ". ./docker/test.sh"

      # Run Python Coverage and Upload to Coveralls
      - name: Run Python Coverage and Upload to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python -m pip install --upgrade pip coverage coveralls==3.3.1
          coverage combine
          coveralls --service=github
        continue-on-error: true

# Uncomment if using a Vue frontend and want coverage
#      # Set up Node.js for Vue
#      - name: Set up Node.js
#        uses: actions/setup-node@v4
#        with:
#          node-version: "24"
#
#      # Install Vue Dependencies
#      - name: Install npm dependencies
#        run: npm install
#
#      # Run Vue Coverage
#      - name: Run Vue Coverage
#        run: npm run coverage
#
#      # Upload Vue Coverage to Coveralls
#      - name: Upload Vue Coverage to Coveralls
#        uses: coverallsapp/github-action@v2
#        with:
#          github-token: ${{ secrets.GITHUB_TOKEN }}
#          path-to-lcov: ./coverage/lcov.info
#          flag-name: app_name_vue
#          parallel: true
#
#      # Finalize Coveralls Parallel Build
#      - name: Finish Coveralls Build
#        uses: coverallsapp/github-action@v2
#        with:
#          github-token: ${{ secrets.GITHUB_TOKEN }}
#          parallel-finished: true

      - name: Run vulnerability scan
        id: vuln-scan
        uses: uw-it-aca/actions/container-vuln-scan@main
        with:
          image_tag: ${{ needs.context.outputs.image_tag }}
          severity: 'HIGH,CRITICAL'

      - name: Fail on vulnerabilities (optional step)
        # Remove this entire block if you don't want to fail the build
        if: steps.vuln-scan.outputs.vulnerabilities_found == 'true'
        shell: bash
        run: |
          echo "High or critical vulnerabilities found!"
          cat ${{ steps.vuln-scan.outputs.results_file }}
          exit 1

      # gcr-push decides what to push from the triggering event: a
      # same-repo pull_request pushes the content-tagged candidate (so a
      # later merge can promote it instead of rebuilding); a push pushes
      # image_tag plus the content tag as an additional_tag, since this job
      # only runs at all when promote didn't already ship the image.
      - name: Push Image to Repository
        uses: uw-it-aca/actions/gcr-push@main
        with:
          image_tag: ${{ needs.context.outputs.image_tag }}
          content_image_tag: ${{ needs.context.outputs.content_image_tag }}
          additional_tags: ${{ needs.context.outputs.content_tag }}
          gcp_json_key: ${{ secrets.GCP_JSON_KEY }}

  deploy:
    # !failure() && !cancelled(): build is legitimately skipped whenever
    # promote shipped the image already, and that must not skip deploy too.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}

    needs: [context, promote, build]

    outputs:
      context: ${{ steps.context.outputs.context }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Deployment Pipeline
        if: >-
          contains(fromJSON('["main", "master", "develop", "qa"]'),
            needs.context.outputs.git_repo_branch)
        uses: uw-it-aca/actions/cicd-deploy@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}

      - name: Deploy Evaluation Branch
        if: needs.context.outputs.git_repo_branch == 'feature/eval-me'
        uses: uw-it-aca/actions/cicd-deploy@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          app_instance: eval

      - name: 'Surface context from executed build step'
        id: context
        shell: bash
        run: echo "context=$(< ${CONTEXT_FILENAME})" >> $GITHUB_OUTPUT

  housekeeping:
    # !failure() && !cancelled(): same reasoning as deploy - build may be
    # legitimately skipped, that alone must not skip housekeeping too.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}

    needs: [context, promote, build, deploy]

    runs-on: ubuntu-24.04

    steps:
      - name: House Keeping
        uses: uw-it-aca/actions/cicd-housekeeping@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          registry_password: ${{ secrets.GCP_JSON_KEY }}
          context: ${{ needs.deploy.outputs.context }}
