name: Django Container Smoke Test Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build App Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app-container
          tags: infohub:smoke-test
          push: false
          load: true

      - name: Smoke-test production image
        uses: uw-it-aca/actions/django-container-smoke-test@main
        with:
          image: infohub:smoke-test
          health-check-url: http://127.0.0.1:8000/metrics
          additional-env: |
            AUTH=BLTI_DEV
            CLUSTER_CNAME=127.0.0.1
            DJANGO_SECRET=ci-not-a-real-secret
            LTI_DEVELOP_APP=infohub
